name: Release Build

# Merge feature branches into `release`, then CI builds and publishes automatically.
on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Show Xcode version
      run: |
        xcodebuild -version
        swift --version

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project LyricsX.xcodeproj \
          -scheme LyricsX \
          -skipMacroValidation

    - name: Build
      run: |
        xcodebuild build \
          -project LyricsX.xcodeproj \
          -scheme LyricsX \
          -configuration Release \
          -destination "platform=macOS" \
          -derivedDataPath ${{ runner.temp }}/DerivedData \
          -skipMacroValidation \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Prepare Artifact
      run: |
        mkdir -p ${{ runner.temp }}/export
        cp -R "${{ runner.temp }}/DerivedData/Build/Products/Release/LyricsX.app" "${{ runner.temp }}/export/"
        cd "${{ runner.temp }}/export"
        ditto -c -k --sequesterRsrc --keepParent LyricsX.app LyricsX.zip

    - name: Upload Artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: LyricsX
        path: ${{ runner.temp }}/export/LyricsX.zip
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        name: LyricsX latest-build (${{ github.sha }})
        tag_name: latest-build
        target_commitish: release
        draft: false
        prerelease: true
        files: ${{ runner.temp }}/export/LyricsX.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
