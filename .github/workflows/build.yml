name: Build


on:
  push:
    branches: [ master, build, release ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Show Xcode version
      run: |
        xcodebuild -version
        swift --version
    
    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project LyricsX.xcodeproj \
          -scheme LyricsX \
          -skipMacroValidation
    
    - name: Build
      run: |
        xcodebuild build \
          -project LyricsX.xcodeproj \
          -scheme LyricsX \
          -configuration Release \
          -destination "platform=macOS" \
          -derivedDataPath ${{ runner.temp }}/DerivedData \
          -skipMacroValidation \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Prepare Artifact
      run: |
        mkdir -p ${{ runner.temp }}/export
        cp -R "${{ runner.temp }}/DerivedData/Build/Products/Release/LyricsX.app" "${{ runner.temp }}/export/"
        cd "${{ runner.temp }}/export"
        ditto -c -k --sequesterRsrc --keepParent LyricsX.app LyricsX.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LyricsX
        path: ${{ runner.temp }}/export/LyricsX.zip
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: LyricsX ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('latest-build ({0})', github.sha) }}
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
        draft: false
        prerelease: ${{ github.ref == 'refs/heads/release' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        files: ${{ runner.temp }}/export/LyricsX.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
